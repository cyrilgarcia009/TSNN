name: tsnn
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip

  # Core scientific stack
  - numpy>=1.26
  - pandas>=2.0
  - scipy>=1.11
  - scikit-learn>=1.3
  - matplotlib>=3.7
  - tqdm>=4.65

  # Jupyter
  - jupyterlab>=4.0
  - ipykernel>=6.20
  - ipywidgets

  # PyTorch — CPU fallback; override with CUDA wheel via pip on GPU machines (see README)
  - pytorch>=2.1
  - torchvision
  - cpuonly                 # remove this line and install CUDA wheel via pip on GPU machines

  - pip:
      # Real-data experiment dependencies
      - neuralforecast>=1.7
      - datasetsforecast>=0.0.8
